name: QQQ AI Daily Report


on:

  schedule:

    # 매일 오전 7시 (한국시간)
    # GitHub Actions UTC 기준
    # UTC 22:00 = KST 07:00

    - cron: "0 22 * * *"


  workflow_dispatch:



jobs:


  qqq-report:


    runs-on: ubuntu-latest



    permissions:

      contents: read



    steps:


      # ==========================
      # 코드 다운로드
      # ==========================

      - name: Checkout Repository

        uses: actions/checkout@v4



      # ==========================
      # Python 설정
      # ==========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: pip



      # ==========================
      # 라이브러리 설치
      # ==========================

      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      # ==========================
      # Secret 확인
      # ==========================

      - name: Check Environment Variables

        env:

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}

          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}


        run: |


          echo "환경 변수 확인"


          if [ -z "$OPENAI_API_KEY" ]; then

            echo "❌ OPENAI_API_KEY 없음"

            exit 1

          else

            echo "✅ OPENAI_API_KEY 확인"

          fi



          if [ -z "$NAVER_EMAIL" ]; then

            echo "❌ NAVER_EMAIL 없음"

            exit 1

          else

            echo "✅ NAVER_EMAIL 확인"

          fi



          if [ -z "$NAVER_PASSWORD" ]; then

            echo "❌ NAVER_PASSWORD 없음"

            exit 1

          else

            echo "✅ NAVER_PASSWORD 확인"

          fi




      # ==========================
      # QQQ AI 리포트 실행
      # ==========================

      - name: Run QQQ AI Report


        env:


          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}


          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}


          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}



        run: |


          python qqq_report.py
