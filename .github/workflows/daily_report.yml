name: QQQ AI Daily Report


on:

  workflow_dispatch:

  schedule:
    - cron: '30 22 * * 1-5'


jobs:

  report:

    runs-on: ubuntu-latest


    steps:

    - name: 코드 가져오기
      uses: actions/checkout@v4


    - name: Python 설치
      uses: actions/setup-python@v5

      with:
        python-version: "3.11"


    - name: 라이브러리 설치
      run: |
        pip install -r requirements.txt


    - name: QQQ 리포트 실행
      run: |
        python qqq_report.py
