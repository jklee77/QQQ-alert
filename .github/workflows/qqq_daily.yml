name: QQQ Daily Alert

on:
  schedule:
    # 한국시간 오전 7시 30분 실행
    # UTC 기준 22시 30분 (월~금)
    - cron: '30 22 * * 1-5'

  workflow_dispatch:


jobs:

  qqq-alert:

    runs-on: ubuntu-latest


    steps:

      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4


      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: 필요한 라이브러리 설치
        run: |
          pip install -r requirements.txt


      - name: QQQ 분석 실행
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          RECEIVE_EMAIL: ${{ secrets.RECEIVE_EMAIL }}

        run: |
          python qqq_signal.py
