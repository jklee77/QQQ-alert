name: QQQ Daily Alert

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

jobs:
  run-qqq-alert:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: QQQ 분석 실행
        env:
          KAKAO_TOKEN: ${{ secrets.KAKAO_TOKEN }}
        run: |
          python qqq_signal.py
